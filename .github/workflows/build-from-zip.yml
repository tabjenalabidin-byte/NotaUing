name: Build APK Buku Nota

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak ZIP proyek
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          echo "=== Mencari ZIP ==="

          ZIP=$(find . \
            -path './.git' -prune -o \
            -type f -iname '*.zip' -print | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "ZIP ditemukan: $ZIP"
            unzip -o "$ZIP" -d extracted
          else
            echo "Tidak ada ZIP. Menggunakan file repository langsung."
          fi

          echo "=== Mencari settings.gradle ==="

          SETTINGS=$(find . \
            -path './.git' -prune -o \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -type f -print | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            echo ""
            echo "=== Struktur repository ==="
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyek Android ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Isi proyek ==="
          ls -la

          echo "=== Build APK ==="

          gradle assembleDebug --no-daemon

      - name: Cari APK
        shell: bash
        run: |
          echo "=== APK hasil build ==="

          find "$PROJECT_DIR" \
            -type f \
            -name '*.apk' \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BukuNota-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
