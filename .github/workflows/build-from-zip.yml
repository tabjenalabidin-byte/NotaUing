name: Build APK Buku Nota

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak proyek dari ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP=$(find . \
            -path './.git' -prune -o \
            -type f -iname '*.zip' -print | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP proyek tidak ditemukan."
            exit 1
          fi

          echo "ZIP proyek: $ZIP"

          unzip -o "$ZIP" -d extracted

          echo "=== Isi hasil ekstraksi ==="
          find extracted -maxdepth 4 -type f | sort

      - name: Tentukan proyek Android
        shell: bash
        run: |
          set -e

          # Prioritaskan proyek yang baru diekstrak dari ZIP
          SETTINGS=$(find extracted \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan di dalam ZIP."
            find extracted -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyek Android:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Periksa modul Android
        shell: bash
        run: |
          set -e

          echo "=== Struktur proyek ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1
          fi

          echo "Modul app ditemukan."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Gradle tasks ==="
          gradle tasks --all

          echo "=== Build APK Debug ==="
          gradle :app:assembleDebug --no-daemon

      - name: Cari APK
        shell: bash
        run: |
          echo "=== APK ==="

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name '*.apk' \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BukuNota-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
