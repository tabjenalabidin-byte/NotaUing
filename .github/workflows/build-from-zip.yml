name: Build APK Buku Nota

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak semua ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          echo "Mencari ZIP..."

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP utama: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo "Mencari ZIP di dalam ZIP..."

          INNER_ZIP=$(find extracted -type f -iname "*.zip" | head -n 1)

          if [ -n "$INNER_ZIP" ]; then
            echo "ZIP kedua ditemukan: $INNER_ZIP"

            mkdir -p project
            unzip -o "$INNER_ZIP" -d project
          else
            echo "Tidak ada ZIP kedua."
            cp -r extracted/* project/ 2>/dev/null || true
          fi

          echo "Isi proyek:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: Cari proyek Android
        run: |
          SETTINGS=$(find project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan!"
            echo "Struktur file:"
            find project -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyek Android ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "Menjalankan Gradle..."

          gradle assembleDebug --no-daemon

      - name: Cari APK
        run: |
          echo "APK yang dihasilkan:"
          find "$PROJECT_DIR" \
            -type f \
            -iname "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BukuNota-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
